<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="수업과 실험을 위한 Cho-WH의 정적 웹 도구 모음"
    />
    <title>EduLink | 수업과 실험을 위한 웹 도구 모음</title>
    <link rel="stylesheet" href="assets/styles.css" />
    <script src="data/tools.js" defer></script>
    <script src="assets/app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="nav-shell" aria-label="주요 링크">
        <a class="brand" href="./" aria-label="EduLink 홈">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>EduLink</span>
        </a>
        <div class="nav-actions">
          <a href="https://github.com/Cho-WH" target="_blank" rel="noreferrer">
            GitHub
          </a>
          <a href="#tools">Tools</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <div class="intro-copy">
          <p class="eyebrow">Cho-WH Web Tools</p>
          <h1 id="page-title">수업과 실험을 위한 웹 도구 모음</h1>
          <p class="intro-text">
            브라우저에서 바로 실행하는 실험 대시보드, 센서 학습 자료,
            소리 분석 도구를 한곳에 모았습니다.
          </p>
        </div>
        <dl class="summary-strip" aria-label="도구 요약">
          <div>
            <dt id="tool-count">0</dt>
            <dd>등록 도구</dd>
          </div>
          <div>
            <dt id="category-count">0</dt>
            <dd>분류</dd>
          </div>
          <div>
            <dt>HTML</dt>
            <dd>정적 실행</dd>
          </div>
        </dl>
      </section>

      <section class="toolbar" aria-label="도구 검색 및 필터">
        <div class="search-wrap">
          <label for="tool-search">도구 검색</label>
          <input
            id="tool-search"
            type="search"
            autocomplete="off"
            placeholder="도구 검색"
          />
        </div>
        <div
          class="filter-list"
          id="filter-list"
          role="list"
          aria-label="도구 분류"
        ></div>
      </section>

      <section class="tool-section" id="tools" aria-labelledby="tools-title">
        <div class="section-heading">
          <h2 id="tools-title">도구</h2>
          <p id="result-count" aria-live="polite">0개 표시</p>
        </div>
        <div class="tool-grid" id="tool-grid"></div>
        <div class="empty-state" id="empty-state" hidden>
          <p>일치하는 도구가 없습니다.</p>
          <button type="button" id="reset-filters">전체 보기</button>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <a href="https://github.com/Cho-WH/edulink" target="_blank" rel="noreferrer">
        edulink 저장소
      </a>
    </footer>
  </body>
</html>
